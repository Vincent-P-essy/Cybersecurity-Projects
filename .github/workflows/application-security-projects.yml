name: Application security projects

on:
  push:
    branches: [main]
    paths:
      - 'PROJECTS/advanced/secure-transfer-engine/**'
      - 'PROJECTS/advanced/webhook-security-gateway/**'
      - 'PROJECTS/advanced/restore-drill/**'
      - '.github/workflows/application-security-projects.yml'
  pull_request:
    paths:
      - 'PROJECTS/advanced/secure-transfer-engine/**'
      - 'PROJECTS/advanced/webhook-security-gateway/**'
      - 'PROJECTS/advanced/restore-drill/**'
      - '.github/workflows/application-security-projects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    defaults:
      run:
        working-directory: PROJECTS/advanced/secure-transfer-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and test ledger invariants
        run: bash run.sh test
      - name: Run restart demonstration
        run: bash run.sh demo
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        project: [webhook-security-gateway, restore-drill]
    defaults:
      run:
        working-directory: PROJECTS/advanced/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test real persistence and failure paths
        run: python3 -m unittest discover -s tests -v
      - name: Run local demonstration
        run: python3 demo.py
